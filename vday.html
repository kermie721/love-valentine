<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Love Me Valentine 💘</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      position: relative;
      width: 350px;
    }

    .card img {
      width: 200px;
      border-radius: 10px;
      margin-bottom: 20px;
      pointer-events: none;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .buttons {
      position: relative;
      height: 60px;
    }

    button {
      padding: 14px 26px;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
    }

    #yesBtn {
      background-color: #ff5a7a;
      color: white;
      left: 50%;
      transform: translateX(-120%);
      box-shadow: 0 4px 15px rgba(255, 90, 122, 0.5);
    }

    #noBtn {
      background-color: #ddd;
      color: #333;
      left: 50%;
      transform: translateX(20%);
    }

    #yesBtn:hover {
      transform: translateX(-120%) scale(1.1);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="love.jpg" alt="cute bears">
    <h1>Do you to be my valentine? 💕</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
  const noBtn = document.getElementById("noBtn");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  document.getElementById("yesBtn").onclick = () => {
    window.location.href = "love.html";
  };
</script>


</body>
</html>
